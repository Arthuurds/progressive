<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="../assets/img/brand/favicon.svg">
    <title>Progressive — Análise de Sobrecarga</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <img class="logo" src="../assets/img/brand/symbol.svg" alt="" width="40" height="40">
            <p class="brand-name">PROGRESSIVE <span>TREINO & EVOLUÇÃO</span></p>
        </div>
        <div class="user-info">
            <span class="user-name">Rodrigo Silva</span>
            <span class="avatar">RS</span>
            <a href="../index.html" class="btn-logout" title="Sair" aria-label="Sair">🚪</a>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav aria-label="Navegação principal">
                <ul>
                    <li><a href="dashboard.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19Z"/></svg><span>Visão Geral</span></a></li>
                    <li><a href="treinos.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 2.5h6v3H9z"/><path d="M8.5 11h7M8.5 15h4.5"/></svg><span>Treinos</span></a></li>
                    <li><a href="biblioteca.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Biblioteca</span></a></li>
                    <li class="active"><a href="evolucao.html" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 20v-6M12 20V10M18.5 20V4"/></svg><span>Evolução</span></a></li>
                    <li><a href="calculadora.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg><span>Calculadora</span></a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-title-bar">
                <div>
                    <h1>Análise de Sobrecarga Progressiva</h1>
                    <p>Acompanhe a evolução de peso levantado para cada exercício</p>
                </div>
            </header>

            <section class="chart-card" aria-labelledby="titulo-grafico">
                <h2 id="titulo-grafico">Evolução de Carga por Exercício</h2>
                <div class="chart-header">
                    <label for="select-exercicio">📈 Selecione o Exercício:</label>
                    <select id="select-exercicio">
                        <option value="supino">Supino Reto com Barra</option>
                        <option value="agachamento">Agachamento Livre</option>
                        <option value="terra">Levantamento Terra</option>
                    </select>
                </div>

                <!-- Gráfico de Linha em SVG -->
                <figure class="line-chart-wrapper">
                    <svg viewBox="0 0 500 200" width="100%" height="250" role="img" aria-labelledby="svg-titulo">
                        <title id="svg-titulo">Gráfico de linha da evolução da carga de 80 kg a 100 kg em 5 sessões</title>
                        <!-- Grade do Gráfico -->
                        <line x1="40" y1="20" x2="480" y2="20" stroke="#222" />
                        <line x1="40" y1="60" x2="480" y2="60" stroke="#222" />
                        <line x1="40" y1="100" x2="480" y2="100" stroke="#222" />
                        <line x1="40" y1="140" x2="480" y2="140" stroke="#222" />
                        <line x1="40" y1="180" x2="480" y2="180" stroke="#222" />

                        <!-- Linha de Evolução Verde -->
                        <polyline fill="none" stroke="#10b981" stroke-width="3" points="50,170 150,130 250,100 350,70 450,30" />
                        
                        <!-- Pontos das Sessões -->
                        <circle cx="50" cy="170" r="4" fill="#10b981" />
                        <circle cx="150" cy="130" r="4" fill="#10b981" />
                        <circle cx="250" cy="100" r="4" fill="#10b981" />
                        <circle cx="350" cy="70" r="4" fill="#10b981" />
                        <circle cx="450" cy="30" r="4" fill="#10b981" />
                    </svg>
                    <figcaption>Evolução da carga (kg) da Sessão 1 (80kg) até à Sessão 5 (100kg).</figcaption>
                </figure>
            </section>

        </main>
    </div>

</body>
</html>
