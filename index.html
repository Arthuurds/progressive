<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2330d158%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 text-anchor=%22middle%22>🏋️</text></svg>">
    <title>Progressive — Criar Conta / Entrar</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main class="auth-container">
        <!-- Logo e Titulo -->
        <header class="auth-header">
            <div class="logo-icon">🏋️</div>
            <h1>PROGRESSIVE</h1>
            <p>EVOLUÇÃO & CARGAS DE TREINO</p>
        </header>

        <!-- Alternador de Modos: os radios controlam, via CSS (:checked), qual formulário aparece -->
        <input type="radio" name="modo-acesso" id="modo-cadastro" class="sr-only" checked>
        <input type="radio" name="modo-acesso" id="modo-login" class="sr-only">

        <div class="auth-tabs">
            <label for="modo-cadastro" class="tab-btn">👤+ Criar Conta</label>
            <label for="modo-login" class="tab-btn">🚪 Já tenho Conta</label>
        </div>

        <!-- Formulario de Registo -->
        <form action="pages/dashboard.html" method="GET" class="auth-form form-cadastro">
            <h2 class="sr-only">Criar conta</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">NOME COMPLETO</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Rodrigo Silva" required>
                </div>

                <div class="form-group">
                    <label for="email">E-MAIL</label>
                    <input type="email" id="email" name="email" placeholder="rodrigo@email.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="idade">IDADE</label>
                    <input type="number" id="idade" name="idade" placeholder="26" required>
                </div>

                <div class="form-group">
                    <label for="peso">PESO (KG)</label>
                    <input type="number" id="peso" name="peso" step="0.1" placeholder="78.5" required>
                </div>

                <div class="form-group">
                    <label for="altura">ALTURA (CM)</label>
                    <input type="number" id="altura" name="altura" placeholder="178" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="objetivo">OBJETIVO PRINCIPAL</label>
                    <select id="objetivo" name="objetivo">
                        <option value="hipertrofia" selected>Ganho de Massa (Hipertrofia)</option>
                        <option value="forca">Ganho de Força Brutal</option>
                        <option value="emagrecimento">Definição / Emagrecimento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nivel">NÍVEL DE EXPERIÊNCIA</label>
                    <select id="nivel" name="nivel">
                        <option value="iniciante">Iniciante (0-1 ano)</option>
                        <option value="intermediario" selected>Intermediário (1–3 anos)</option>
                        <option value="avancado">Avançado (3+ anos)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">SENHA DE ACESSO</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Concluir Cadastro e Ir ao Dashboard →</button>

            <div class="demo-access">
                <a href="pages/dashboard.html">🧪 Entrar direto com dados de demonstração (Testar sem cadastro)</a>
            </div>

        </form>

        <!-- Formulario de Login -->
        <form action="pages/dashboard.html" method="GET" class="auth-form form-login">
            <h2 class="sr-only">Entrar na conta</h2>

            <div class="form-group">
                <label for="login-email">E-MAIL</label>
                <input type="email" id="login-email" name="email" placeholder="rodrigo@email.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="login-senha">SENHA</label>
                <input type="password" id="login-senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-submit">Entrar →</button>

            <div class="demo-access">
                <a href="pages/dashboard.html">🧪 Entrar direto com dados de demonstração</a>
            </div>
        </form>
    </main>

</body>
</html>
